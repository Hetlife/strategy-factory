name: Strategy Factory - Diagnose Nifty 100 Tickers

on:
  workflow_dispatch:

# Manual-only, read-only diagnostic. No schedule, no commits -- checks
# whether every ticker in UNIVERSE["nifty100"] actually resolves on
# Yahoo Finance (this sandbox can't reach it, GitHub Actions runners
# can). See tools/diagnose_nifty100_tickers.py for the full context.

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Run diagnostic
        run: python tools/diagnose_nifty100_tickers.py
