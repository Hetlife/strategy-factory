name: Strategy Factory - Diagnose Nifty 100 vs NSE Official List

on:
  workflow_dispatch:

# Manual-only, read-only diagnostic. No schedule, no commits -- compares
# UNIVERSE["nifty100"] against NSE's own official, currently-published
# Nifty 100 constituent CSV (this sandbox can't reach nseindia.com,
# GitHub Actions runners can). See
# tools/diagnose_nifty100_official_list.py for the full context.

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run diagnostic
        run: python tools/diagnose_nifty100_official_list.py
