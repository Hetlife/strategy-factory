name: Strategy Factory - Supervisor

on:
  workflow_dispatch:

  schedule:
    # Every 15 minutes. Detection-only, no commits -- pure health_check.py
    # logic, no Claude session, no extra cost (GitHub Actions free minutes).
    # GitHub may delay/skip runs on a cron this frequent during high load;
    # that's a GitHub-side limitation, not something this workflow controls.
    - cron: "*/15 * * * *"

concurrency:
  group: strategy-factory-supervisor
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Cache pip's download dir so each run stops re-downloading the
          # same wheels. Measured 2026-08-28: "Install dependencies" was
          # ~11s of every run (65-79% of total job time) while the actual
          # work took <2s. Keyed on requirements.txt, which pins the full
          # superset -- each workflow still installs only the subset it
          # needs, it just gets the wheels from cache instead of PyPI.
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run supervisor check (one health_check per enabled profile)
        # CE-1-04: loop over every enabled asset-class profile (all, no
        # filter) and run health_check.py for each. --live: read each
        # profile's ledger from main, not the local checkout. ledger.json
        # is only ever committed to main, so a branch checkout looks
        # days-stale and would raise a FALSE "daily run stopped" alarm
        # (caught 2026-08-29). Every profile runs even if an earlier one
        # fails, then the job fails if any did. Detection only, no commits.
        run: |
          PROFILES=$(python tools/list_enabled_profiles.py)
          echo "enabled profiles: $PROFILES"
          LIST=$(python -c "import json,sys; print(' '.join(json.loads(sys.argv[1])))" "$PROFILES")
          if [ -z "$LIST" ]; then
            echo "no enabled profiles -- nothing is being supervised"
            exit 1
          fi
          FAILED=0
          for P in $LIST; do
            echo "::group::health_check --profile $P"
            python tools/health_check.py --profile "$P" --live || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED
