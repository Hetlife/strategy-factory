name: Strategy Factory

on:
  workflow_dispatch:

  schedule:
    # Runs every weekday at 6:15 PM IST
    - cron: "45 12 * * 1-5"
    # Runs every Sunday at 10:00 AM IST
    - cron: "30 4 * * 0"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  strategy-factory:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Cache pip's download dir so each run stops re-downloading the
          # same wheels. Measured 2026-08-28: "Install dependencies" was
          # ~11s of every run (65-79% of total job time) while the actual
          # work took <2s. Keyed on requirements.txt, which pins the full
          # superset -- each workflow still installs only the subset it
          # needs, it just gets the wheels from cache instead of PyPI.
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy

      - name: Create state directory
        run: |
          mkdir -p factory_state

      - name: Run daily arena update
        run: |
          python factory.py update

      - name: Generate weekly report (Sunday only)
        if: github.event.schedule == '30 4 * * 0'
        run: |
          python factory.py report

      - name: Commit updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add factory_state

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Factory update $(date -u +'%Y-%m-%d')" || true

          for i in 1 2 3; do
            git fetch origin
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push conflict detected. Retrying..."
            sleep 5
          done

          echo "Failed after 3 attempts."
          exit 1
        
