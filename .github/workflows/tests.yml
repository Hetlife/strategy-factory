name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  golden-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pandas numpy
      - run: python3 -m unittest discover -s tests -v
