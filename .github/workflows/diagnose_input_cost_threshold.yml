name: Strategy Factory - Diagnose Input Cost Threshold

on:
  workflow_dispatch:

# Manual-only, read-only diagnostic. No schedule, no commits -- checks
# whether input_cost's BZ=F (Brent crude) 20-day-drop threshold ever
# actually crosses in real recent price history (this sandbox can't
# reach Yahoo Finance, GitHub Actions runners can). Same pattern as
# diagnose_event_thresholds.yml. See
# tools/diagnose_input_cost_threshold.py for full context.

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Run diagnostic
        run: python tools/diagnose_input_cost_threshold.py
